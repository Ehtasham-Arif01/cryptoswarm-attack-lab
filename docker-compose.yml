# Start:   docker compose up -d --build
# Scale:   docker compose up -d --scale worker=8
# Kill one worker (fault-tolerance demo):  docker kill <container>
# Dashboard: http://localhost:8090

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  coordinator:
    build: { context: ., dockerfile: coordinator/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379/0
      ORACLE_URL: http://oracle:9000
      HISTORY_DB: /data/history.db
    volumes:
      - history:/data   # attack history (SQLite) survives restarts
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CPUS: ${WORKER_CPUS:-0.25}
      ORACLE_URL: http://oracle:9000
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 5s
    # Each worker acts as a small "cloud server" with a fixed CPU share, so adding
    # workers scales roughly linearly until the host's cores are full
    # (2 cores / 0.25 = 8 workers). Set WORKER_CPUS=0 to remove the limit.
    cpus: ${WORKER_CPUS:-0.25}

  # The deliberately vulnerable web server for the padding-oracle attack.
  # It is the "victim": not CPU-capped, not reachable from the host.
  oracle:
    build: { context: ., dockerfile: oracle/Dockerfile }

  dashboard:
    image: nginx:1.27-alpine
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DASHBOARD_PORT:-8090}:80"
    depends_on: [coordinator]

volumes:
  history:
