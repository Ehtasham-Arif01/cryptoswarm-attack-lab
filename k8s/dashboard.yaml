# Static dashboard + reverse proxy to the coordinator, exposed on NodePort 30080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101 }
      containers:
        - name: dashboard
          image: cryptoswarm/dashboard:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: DNS_RESOLVER, value: "kube-dns.kube-system.svc.cluster.local" }
            - { name: COORDINATOR_HOST, value: "coordinator.cryptoswarm.svc.cluster.local" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:  # nginx writes its pid/temp files and the config generated from the template
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector: { app: dashboard }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
