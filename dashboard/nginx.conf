server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Re-resolve the coordinator every 5 s so a rebuilt
    # coordinator container (new IP) doesn't cause 502 errors.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $coordinator http://coordinator:8000;

    location /api/ {
        proxy_pass $coordinator;
    }

    location /ws {
        proxy_pass $coordinator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /nginx.conf { return 404; }
}
