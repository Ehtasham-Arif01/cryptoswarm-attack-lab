# CI/CD for CryptoSwarm
#
#   test      lint (ruff) + unit tests + dashboard JS syntax check
#   security  Trivy scan of the repo: vulnerable dependencies, leaked secrets, Dockerfile misconfigurations
#   e2e       build images (incl. Rust worker + cargo test) → Trivy image scan → start the stack
#             with Python + Rust workers → run every attack end-to-end
#             → on main: push images to GitHub Container Registry (private, like the repo)
#
# A HIGH or CRITICAL finding that has a fix available fails the pipeline.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Unit tests (pytest)
        run: pytest -q

      - name: Dashboard JavaScript syntax
        run: node --check dashboard/app.js

  security:
    name: Trivy repo scan (deps, secrets, Dockerfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD":/src:ro "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  e2e:
    name: Build, scan images, end-to-end attacks, deliver
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    env:
      TAG: ${{ github.sha }}
      WORKER_CPUS: "0" # CI runners have real cores: no per-worker CPU cap
    steps:
      - uses: actions/checkout@v7

      - name: Image names (registry paths must be lowercase)
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Build images (the Rust image runs `cargo test` while building)
        run: docker compose build

      - name: Trivy image scan (OS packages + Python packages inside the images)
        run: |
          for svc in coordinator worker worker-rust oracle dashboard; do
            echo "::group::Trivy: $svc"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$REGISTRY/$svc:$TAG"
            echo "::endgroup::"
          done

      - name: Start the stack (4 Python + 2 Rust workers)
        run: docker compose up -d --scale worker=4 --scale worker-rust=2

      - name: End-to-end attacks (smoke test)
        run: python3 scripts/smoke_test.py http://localhost:8090

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (commit SHA + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for svc in coordinator worker worker-rust oracle dashboard; do
            docker push "$REGISTRY/$svc:$TAG"
            docker tag "$REGISTRY/$svc:$TAG" "$REGISTRY/$svc:latest"
            docker push "$REGISTRY/$svc:latest"
          done
          echo "### 📦 Images pushed" >> "$GITHUB_STEP_SUMMARY"
          for svc in coordinator worker worker-rust oracle dashboard; do echo "- \`$REGISTRY/$svc:$TAG\`" >> "$GITHUB_STEP_SUMMARY"; done
