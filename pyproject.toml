[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
